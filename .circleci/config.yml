version: 2.1

executors:
  dotnet_executor:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    working_directory: ~/project

jobs:
  build:
    executor: dotnet_executor
    steps:
      - checkout
      - run:
          name: Restaurar dependencias
          command: dotnet restore CGA.MetrologySystem.slnx
      - run:
          name: Compilar solución
          command: dotnet build CGA.MetrologySystem.slnx --configuration Release

workflows:
  cga_circleci_pipeline:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - develop
                - /feature\/.*/