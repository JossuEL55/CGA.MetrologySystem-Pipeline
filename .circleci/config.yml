version: 2.1

executors:
  dotnet_executor:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    working_directory: ~/project

jobs:
  build:
    executor: dotnet_executor
    steps:
      - checkout
      - run:
          name: Restaurar dependencias
          command: dotnet restore CGA.MetrologySystem/CGA.MetrologySystem.csproj
      - run:
          name: Compilar proyecto
          command: dotnet build CGA.MetrologySystem/CGA.MetrologySystem.csproj --configuration Release

workflows:
  cga_circleci_pipeline:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - develop
                - /feature\/.*/