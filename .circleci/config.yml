version: 2.1

executors:
  dotnet_executor:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    working_directory: ~/project

commands:
  restore_project:
    steps:
      - run:
          name: Restaurar dependencias
          command: dotnet restore CGA.MetrologySystem/CGA.MetrologySystem.csproj

  build_project:
    steps:
      - run:
          name: Compilar proyecto
          command: dotnet build CGA.MetrologySystem/CGA.MetrologySystem.csproj --configuration Release --no-restore

  test_project:
    steps:
      - run:
          name: Ejecutar pruebas
          command: dotnet test CGA.MetrologySystem/CGA.MetrologySystem.csproj --configuration Release --no-restore

  quality_check:
    steps:
      - run:
          name: Verificar calidad de código
          command: dotnet format CGA.MetrologySystem/CGA.MetrologySystem.csproj --verify-no-changes

jobs:
  restore:
    executor: dotnet_executor
    steps:
      - checkout
      - restore_project

  build:
    executor: dotnet_executor
    steps:
      - checkout
      - restore_project
      - build_project

  test_parallel:
    executor: dotnet_executor
    parallelism: 2
    steps:
      - checkout
      - restore_project
      - test_project

  quality:
    executor: dotnet_executor
    steps:
      - checkout
      - restore_project
      - quality_check

  notify:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Notificación de éxito
          command: echo "Pipeline ejecutado correctamente en CircleCI."
          when: on_success
      - run:
          name: Notificación de fallo
          command: echo "El pipeline falló. Revisar logs en CircleCI."
          when: on_fail

workflows:
  cga_circleci_pipeline:
    jobs:
      # =========================
      # FEATURE BRANCHES
      # feature/* -> restore + build + test
      # =========================
      - restore:
          name: restore_feature
          filters:
            branches:
              only: /feature\/.*/
      - build:
          name: build_feature
          requires:
            - restore_feature
          filters:
            branches:
              only: /feature\/.*/
      - test_parallel:
          name: test_feature
          requires:
            - build_feature
          filters:
            branches:
              only: /feature\/.*/

      # =========================
      # DEVELOP
      # develop -> restore + build + test + quality
      # =========================
      - restore:
          name: restore_develop
          filters:
            branches:
              only: develop
      - build:
          name: build_develop
          requires:
            - restore_develop
          filters:
            branches:
              only: develop
      - test_parallel:
          name: test_develop
          requires:
            - build_develop
          filters:
            branches:
              only: develop
      - quality:
          name: quality_develop
          requires:
            - build_develop
          filters:
            branches:
              only: develop

      # =========================
      # MAIN
      # main -> restore + build + test + quality + notify
      # =========================
      - restore:
          name: restore_main
          filters:
            branches:
              only: main
      - build:
          name: build_main
          requires:
            - restore_main
          filters:
            branches:
              only: main
      - test_parallel:
          name: test_main
          requires:
            - build_main
          filters:
            branches:
              only: main
      - quality:
          name: quality_main
          requires:
            - build_main
          filters:
            branches:
              only: main
      - notify:
          name: notify_main
          requires:
            - test_main
            - quality_main
          filters:
            branches:
              only: main