version: 2.1

orbs:
  slack: circleci/slack@4.13.3

executors:
  dotnet_executor:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    working_directory: ~/project

commands:
  restore_project:
    steps:
      - run:
          name: Restaurar dependencias
          command: dotnet restore CGA.MetrologySystem/CGA.MetrologySystem.csproj

  build_project:
    steps:
      - run:
          name: Compilar proyecto
          command: dotnet build CGA.MetrologySystem/CGA.MetrologySystem.csproj --configuration Release --no-restore

  test_project:
    steps:
      - run:
          name: Ejecutar pruebas automáticas
          command: dotnet test CGA.MetrologySystem/CGA.MetrologySystem.csproj --configuration Release --no-restore

  quality_check:
    steps:
      - run:
          name: Verificar calidad de código
          command: dotnet format CGA.MetrologySystem/CGA.MetrologySystem.csproj --verify-no-changes

jobs:
  restore:
    executor: dotnet_executor
    steps:
      - checkout
      - restore_project

  build:
    executor: dotnet_executor
    steps:
      - checkout
      - restore_project
      - build_project

  test_parallel:
    executor: dotnet_executor
    parallelism: 2
    steps:
      - checkout
      - restore_project
      - test_project

  quality:
    executor: dotnet_executor
    steps:
      - checkout
      - restore_project
      - quality_check

  notify:
    docker:
      - image: cimg/base:stable
    steps:
      - slack/notify:
          event: pass
          template: basic_success_1
      - slack/notify:
          event: fail
          template: basic_fail_1

workflows:
  cga_circleci_pipeline:
    jobs:
      - restore:
          filters:
            branches:
              only:
                - main
                - develop
                - /feature\/.*/
      - build:
          requires:
            - restore
          filters:
            branches:
              only:
                - main
                - develop
                - /feature\/.*/
      - test_parallel:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - develop
                - /feature\/.*/
      - quality:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - develop
                - /feature\/.*/
      - notify:
          requires:
            - test_parallel
            - quality
          filters:
            branches:
              only:
                - main
                - develop
                - /feature\/.*/